<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oura authorization</title>
<style>body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1.25rem;color:#1c1c1e;text-align:center}
code{display:block;background:#f2f2f7;padding:1rem;border-radius:8px;word-break:break-all;font-size:1.05rem;margin:1.5rem 0;user-select:all}
button{font:inherit;padding:.6rem 1.4rem;border-radius:999px;border:1px solid #c7c7cc;background:#fff;cursor:pointer}
.err{color:#b00020}</style>
</head><body>
<h1>Oura authorization</h1>
<div id="out">Reading response…</div>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get('code'), err = p.get('error');
  var out = document.getElementById('out');
  if (err) {
    out.innerHTML = '<p class="err">Authorization failed: ' + err.replace(/[<>&]/g,'') + '</p>';
  } else if (code) {
    out.innerHTML = '<p>Copy this authorization code and paste it back into the terminal:</p>' +
                    '<code id="c"></code><button id="b">Copy</button>';
    document.getElementById('c').textContent = code;
    document.getElementById('b').onclick = function () {
      navigator.clipboard.writeText(code).then(function(){
        document.getElementById('b').textContent = 'Copied';
      });
    };
  } else {
    out.textContent = 'No authorization code in this URL.';
  }
</script>
</body></html>
